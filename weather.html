
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriNexa - Weather</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f8f3;
            color: #333;
        }

        header {
            background: #176b2c;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: white;
            color: #176b2c;
            padding: 10px 18px;
            border-radius: 7px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1, h2 {
            color: #176b2c;
            margin-bottom: 15px;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            background: #176b2c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #0e4f20;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .weather-item {
            background: #f1f8f3;
            padding: 20px;
            border-radius: 10px;
        }

        .weather-item strong {
            display: block;
            color: #176b2c;
            margin-bottom: 10px;
        }

        .weather-item span {
            font-size: 22px;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            color: #176b2c;
        }

        #advice {
            line-height: 1.8;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .search {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>🌿 AgriNexa Weather</h2>
    <a href="dashboard.html">Dashboard</a>
</header>

<div class="container">

    <div class="card">
        <h1>🌦️ Live Weather</h1>
        <p>Check weather conditions for your farming location.</p>

        <div class="search">
            <input
                type="text"
                id="city"
                placeholder="Enter city (e.g. Udupi)">
            <button onclick="searchWeather()">Search</button>
        </div>

        <button onclick="getMyLocation()" style="margin-top:15px;">
            Use My Location
        </button>

        <p id="message">Enter a city to check the weather.</p>
    </div>

    <div class="card">
        <h2 id="place">Weather Information</h2>

        <div class="weather-grid">

            <div class="weather-item">
                <strong>🌡️ Temperature</strong>
                <span id="temperature">--</span>
            </div>

            <div class="weather-item">
                <strong>💧 Humidity</strong>
                <span id="humidity">--</span>
            </div>

            <div class="weather-item">
                <strong>🌬️ Wind Speed</strong>
                <span id="wind">--</span>
            </div>

            <div class="weather-item">
                <strong>🌧️ Rainfall</strong>
                <span id="rain">--</span>
            </div>

        </div>
    </div>

    <div class="card">
        <h2>🌾 Agricultural Advice</h2>
        <p id="advice">
            Weather-based farming advice will appear here.
        </p>
    </div>

</div>

<script>
    async function searchWeather() {
        const city = document.getElementById("city").value.trim();

        if (!city) {
            document.getElementById("message").innerText =
                "Please enter a city name.";
            return;
        }

        document.getElementById("message").innerText =
            "Loading weather...";

        try {
            const geoResponse = await fetch(
                "https://geocoding-api.open-meteo.com/v1/search?name=" +
                encodeURIComponent(city) +
                "&count=1&language=en&format=json"
            );

            const geoData = await geoResponse.json();

            if (!geoData.results || geoData.results.length === 0) {
                document.getElementById("message").innerText =
                    "City not found. Please try another name.";
                return;
            }

            const location = geoData.results[0];

            await loadWeather(
                location.latitude,
                location.longitude,
                location.name
            );

        } catch (error) {
            document.getElementById("message").innerText =
                "Unable to load weather. Check your internet connection.";
        }
    }

    async function loadWeather(latitude, longitude, cityName) {
        document.getElementById("message").innerText =
            "Getting weather information...";

        try {
            const response = await fetch(
                "https://api.open-meteo.com/v1/forecast?latitude=" +
                latitude +
                "&longitude=" +
                longitude +
                "&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code&timezone=auto"
            );

            if (!response.ok) {
                throw new Error("Weather API error");
            }

            const data = await response.json();
            const current = data.current;

            document.getElementById("place").innerText =
                "📍 " + cityName;

            document.getElementById("temperature").innerText =
                current.temperature_2m + " °C";

            document.getElementById("humidity").innerText =
                current.relative_humidity_2m + "%";

            document.getElementById("wind").innerText =
                current.wind_speed_10m + " km/h";

            document.getElementById("rain").innerText =
                current.precipitation + " mm";

            showAdvice(current);

            document.getElementById("message").innerText =
                "Weather updated successfully!";

        } catch (error) {
            document.getElementById("message").innerText =
                "Unable to load weather. Please try again.";
        }
    }

    function showAdvice(weather) {
        let advice = "";

        if (weather.precipitation > 0) {
            advice += "🌧️ Rain is currently reported. Check field drainage and avoid unnecessary irrigation. ";
        } else {
            advice += "☀️ No current precipitation is reported. Check soil moisture before irrigation. ";
        }

        if (weather.wind_speed_10m > 15) {
            advice += "🌬️ Wind is strong. Consider postponing pesticide spraying until conditions are suitable. ";
        }

        if (weather.temperature_2m > 35) {
            advice += "🌡️ High temperature. Monitor crop moisture and avoid unnecessary field work during peak heat. ";
        }

        if (weather.relative_humidity_2m > 85) {
            advice += "💧 High humidity. Monitor crops for fungal disease risks. ";
        }

        document.getElementById("advice").innerText = advice;
    }

    function getMyLocation() {
        if (!navigator.geolocation) {
            document.getElementById("message").innerText =
                "Location is not supported by this browser.";
            return;
        }

        document.getElementById("message").innerText =
            "Requesting your location...";

        navigator.geolocation.getCurrentPosition(
            async function(position) {
                await loadWeather(
                    position.coords.latitude,
                    position.coords.longitude,
                    "Your Current Location"
                );
            },
            function() {
                document.getElementById("message").innerText =
                    "Location access denied. Enter your city instead.";
            }
        );
    }
</script>

</body>
</html>
